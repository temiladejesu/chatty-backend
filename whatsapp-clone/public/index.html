<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chatty — Real-time Chat</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== AUTH SCREEN ===================== -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.03 2 11c0 2.62 1.28 4.97 3.34 6.62L4 22l4.65-1.53C9.72 20.8 10.84 21 12 21c5.52 0 10-4.03 10-9s-4.48-10-10-10z" fill="#25D366"/></svg>
        <span>Chatty</span>
      </div>

      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active">Log in</button>
        <button id="tab-register" class="auth-tab">Sign up</button>
      </div>

      <form id="login-form" class="auth-form">
        <input type="text" id="login-username" placeholder="Username" autocomplete="username" required />
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required />
        <button type="submit" class="btn-primary">Log in</button>
        <p class="auth-error" id="login-error"></p>
      </form>

      <form id="register-form" class="auth-form hidden">
        <input type="text" id="register-name" placeholder="Your name" required />
        <input type="text" id="register-username" placeholder="Choose a username" autocomplete="username" required />
        <input type="password" id="register-password" placeholder="Choose a password" autocomplete="new-password" required />
        <button type="submit" class="btn-primary">Create account</button>
        <p class="auth-error" id="register-error"></p>
      </form>
    </div>
  </div>

  <!-- ===================== APP SCREEN ===================== -->
  <div id="app-screen" class="app-screen hidden">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="me">
          <span id="my-avatar" class="avatar"></span>
          <span id="my-name" class="my-name"></span>
        </div>
        <button id="logout-btn" class="icon-btn" title="Log out">⎋</button>
      </div>
      <div class="search-box">
        <input type="text" id="contact-search" placeholder="Search contacts" />
      </div>
      <ul id="contact-list" class="contact-list"></ul>
    </aside>

    <!-- Chat panel -->
    <main class="chat-panel">
      <div id="chat-empty" class="chat-empty">
        <p>Select a contact to start chatting</p>
      </div>

      <div id="chat-active" class="chat-active hidden">
        <header class="chat-header">
          <span id="chat-avatar" class="avatar"></span>
          <div class="chat-header-info">
            <div id="chat-name" class="chat-name"></div>
            <div id="chat-status" class="chat-status">offline</div>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <div id="typing-indicator" class="typing-indicator hidden">typing…</div>

        <form id="message-form" class="message-form">
          <input type="text" id="message-input" placeholder="Type a message" autocomplete="off" />
          <button type="submit" class="btn-send" title="Send">➤</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
